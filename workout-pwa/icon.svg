<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3e635"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Dumbbell Icon -->
  <g transform="translate(256, 256)" fill="none" stroke="#000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left weight -->
    <rect x="-180" y="-50" width="50" height="100" rx="8" fill="#000"/>
    <rect x="-155" y="-70" width="25" height="140" rx="6" fill="#000"/>
    
    <!-- Bar -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#000" stroke-width="24"/>
    
    <!-- Right weight -->
    <rect x="130" y="-50" width="50" height="100" rx="8" fill="#000"/>
    <rect x="130" y="-70" width="25" height="140" rx="6" fill="#000"/>
  </g>
</svg>
