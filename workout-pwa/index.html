<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Push Day">
  <meta name="description" content="Mike Thurston's Push Day Workout Tracker">
  
  <title>Push Day - Workout Tracker</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; 
      padding: 0; 
      background: #000; 
      overscroll-behavior: none;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icon components using Lucide
    const Icon = ({ name, className, style }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          icon.classList.add(...(className || '').split(' ').filter(Boolean));
          if (style) Object.assign(icon.style, style);
          ref.current.appendChild(icon);
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    const defaultExercises = [
      { id: 'seated-shoulder-press', name: 'Seated Dumbbell Shoulder Press', sets: 4, reps: '8-12', muscle: 'Shoulders', isDefault: true },
      { id: 'incline-bench-press', name: 'Incline Dumbbell Bench Press', sets: 4, reps: '10-12', muscle: 'Upper Chest', isDefault: true },
      { id: 'lateral-raises', name: 'Standing Dumbbell Lateral Raises', sets: 4, reps: '12-15', muscle: 'Side Delts', isDefault: true },
      { id: 'incline-cable-flyes', name: 'Incline Cable Flyes', sets: 3, reps: '12-15', muscle: 'Chest', isDefault: true },
      { id: 'rope-tricep-pushdowns', name: 'Rope Tricep Pushdowns', sets: 3, reps: '12-15', muscle: 'Triceps', isDefault: true },
      { id: 'overhead-tricep-extensions', name: 'Overhead Tricep Extensions', sets: 3, reps: '12-15', muscle: 'Triceps', isDefault: true },
    ];

    // Storage helper using localStorage
    const storage = {
      get: (key) => {
        try {
          const value = localStorage.getItem(key);
          return value ? { value } : null;
        } catch (e) { return null; }
      },
      set: (key, value) => {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) { return false; }
      },
      delete: (key) => {
        try {
          localStorage.removeItem(key);
          return true;
        } catch (e) { return false; }
      }
    };

    // ============ ADD EXERCISE MODAL ============
    const AddExerciseModal = ({ isOpen, onClose, onAdd }) => {
      const [name, setName] = useState('');
      const [muscle, setMuscle] = useState('');
      const [sets, setSets] = useState('3');
      const [reps, setReps] = useState('10-12');

      const handleSubmit = () => {
        if (!name.trim() || !muscle.trim() || !sets || !reps.trim()) return;
        
        const newExercise = {
          id: `custom-${Date.now()}`,
          name: name.trim(),
          muscle: muscle.trim(),
          sets: parseInt(sets),
          reps: reps.trim(),
          isDefault: false
        };
        
        onAdd(newExercise);
        setName('');
        setMuscle('');
        setSets('3');
        setReps('10-12');
        onClose();
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          
          <div className="relative w-full max-w-md bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl">
            <div className="flex items-center justify-between p-5 border-b border-zinc-800">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-lime-400/20 rounded-xl">
                  <Icon name="Plus" className="w-5 h-5 text-lime-400" />
                </div>
                <h2 className="text-xl font-bold text-white">Add Exercise</h2>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-zinc-800 transition-colors">
                <Icon name="X" className="w-5 h-5 text-zinc-400" />
              </button>
            </div>

            <div className="p-5 space-y-4">
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Exercise Name *</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Barbell Bench Press"
                  className="w-full px-4 py-3 text-base font-medium text-white bg-black border border-zinc-800 rounded-xl focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Muscle Group *</label>
                <input
                  type="text"
                  value={muscle}
                  onChange={(e) => setMuscle(e.target.value)}
                  placeholder="e.g. Chest, Back, Legs"
                  className="w-full px-4 py-3 text-base font-medium text-white bg-black border border-zinc-800 rounded-xl focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600"
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Sets *</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    value={sets}
                    onChange={(e) => setSets(e.target.value)}
                    placeholder="3"
                    className="w-full px-4 py-3 text-base font-bold text-center text-white bg-black border border-zinc-800 rounded-xl focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Rep Range *</label>
                  <input
                    type="text"
                    value={reps}
                    onChange={(e) => setReps(e.target.value)}
                    placeholder="10-12"
                    className="w-full px-4 py-3 text-base font-bold text-center text-white bg-black border border-zinc-800 rounded-xl focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600"
                  />
                </div>
              </div>
            </div>

            <div className="p-5 border-t border-zinc-800">
              <button
                onClick={handleSubmit}
                disabled={!name.trim() || !muscle.trim() || !sets || !reps.trim()}
                className={`w-full py-4 px-6 rounded-xl font-bold text-base uppercase tracking-wider transition-all duration-300 flex items-center justify-center gap-3 ${
                  name.trim() && muscle.trim() && sets && reps.trim()
                    ? 'bg-gradient-to-r from-lime-400 to-emerald-400 text-black hover:from-lime-300 hover:to-emerald-300 active:scale-[0.98]'
                    : 'bg-zinc-800 text-zinc-600 cursor-not-allowed'
                }`}
              >
                <Icon name="Plus" className="w-5 h-5" />
                Add Exercise
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============ FRONT PAGE ============
    const FrontPage = ({ onStart }) => {
      const [animate, setAnimate] = useState(false);
      useEffect(() => { setTimeout(() => setAnimate(true), 100); }, []);

      return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-center relative overflow-hidden px-6">
          <div className="absolute inset-0 overflow-hidden">
            <div className="absolute top-1/4 -left-32 w-96 h-96 bg-lime-400/20 rounded-full blur-3xl" style={{ animation: 'pulse 4s ease-in-out infinite' }} />
            <div className="absolute bottom-1/4 -right-32 w-96 h-96 bg-emerald-400/20 rounded-full blur-3xl" style={{ animation: 'pulse 4s ease-in-out infinite', animationDelay: '2s' }} />
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl" style={{ animation: 'pulse 3s ease-in-out infinite', animationDelay: '1s' }} />
          </div>

          <div className="relative z-10 text-center">
            <div className={`mb-8 transition-all duration-1000 ${animate ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>
              <div className="w-24 h-24 mx-auto bg-gradient-to-br from-lime-400 to-emerald-500 rounded-3xl flex items-center justify-center shadow-2xl shadow-lime-400/30" style={{ animation: 'bounce 2s ease-in-out infinite' }}>
                <Icon name="Dumbbell" className="w-12 h-12 text-black" />
              </div>
            </div>

            <div className={`mb-6 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`} style={{ transitionDelay: '200ms' }}>
              <span className="px-4 py-2 bg-zinc-900/80 border border-zinc-800 rounded-full text-xs font-bold uppercase tracking-widest text-lime-400">
                Mike Thurston • Push Day
              </span>
            </div>

            <h1 className={`text-5xl font-black text-white leading-none mb-4 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '300ms', textShadow: '0 0 80px rgba(163, 230, 53, 0.4)' }}>
              ARE YOU
            </h1>
            <h1 className={`text-5xl font-black leading-none mb-4 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '400ms', background: 'linear-gradient(135deg, #a3e635 0%, #10b981 50%, #06b6d4 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              READY TO
            </h1>
            <h1 className={`text-6xl font-black text-white leading-none mb-12 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-8 scale-90'}`} style={{ transitionDelay: '500ms', textShadow: '0 0 100px rgba(251, 191, 36, 0.5), 0 4px 0 rgba(0,0,0,0.3)' }}>
              KICK ASS?
            </h1>

            <button onClick={onStart} className={`group relative px-12 py-5 text-2xl font-black uppercase tracking-wider transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '700ms' }}>
              <div className="absolute inset-0 bg-gradient-to-r from-lime-400 via-emerald-400 to-lime-400 rounded-2xl blur-lg opacity-60 group-hover:opacity-100 transition-opacity" />
              <div className="absolute inset-0 bg-gradient-to-r from-lime-400 to-emerald-400 rounded-2xl group-hover:from-lime-300 group-hover:to-emerald-300 transition-all active:scale-95" />
              <span className="relative text-black flex items-center gap-3">
                <Icon name="Flame" className="w-7 h-7" />
                HELL YEA!
                <Icon name="Flame" className="w-7 h-7" />
              </span>
            </button>

            <p className={`mt-8 text-zinc-500 text-sm font-medium transition-all duration-700 ${animate ? 'opacity-100' : 'opacity-0'}`} style={{ transitionDelay: '1000ms' }}>
              6 exercises • Shoulders, Chest & Triceps
            </p>
          </div>

          <style>{`
            @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
            @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
          `}</style>
        </div>
      );
    };

    // ============ COMPLETION PAGE ============
    const CompletionPage = ({ onBackToStart }) => {
      const [animate, setAnimate] = useState(false);
      useEffect(() => { setTimeout(() => setAnimate(true), 100); }, []);

      return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-center relative overflow-hidden px-6">
          <div className="absolute inset-0 overflow-hidden">
            <div className="absolute top-1/4 -left-32 w-96 h-96 bg-amber-400/30 rounded-full blur-3xl" style={{ animation: 'pulse 3s ease-in-out infinite' }} />
            <div className="absolute bottom-1/4 -right-32 w-96 h-96 bg-rose-400/20 rounded-full blur-3xl" style={{ animation: 'pulse 3s ease-in-out infinite', animationDelay: '1s' }} />
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-lime-500/20 rounded-full blur-3xl" style={{ animation: 'pulse 2.5s ease-in-out infinite', animationDelay: '0.5s' }} />
          </div>

          <div className="relative z-10 text-center">
            <div className={`mb-8 transition-all duration-1000 ${animate ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>
              <div className="w-28 h-28 mx-auto bg-gradient-to-br from-amber-400 via-orange-500 to-rose-500 rounded-full flex items-center justify-center shadow-2xl shadow-amber-400/40" style={{ animation: 'celebrate 1s ease-in-out infinite' }}>
                <Icon name="PartyPopper" className="w-14 h-14 text-white" />
              </div>
            </div>

            <div className={`mb-6 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`} style={{ transitionDelay: '200ms' }}>
              <span className="px-4 py-2 bg-amber-500/20 border border-amber-500/50 rounded-full text-xs font-bold uppercase tracking-widest text-amber-400">
                🏆 Workout Complete 🏆
              </span>
            </div>

            <h1 className={`text-4xl font-black leading-tight mb-4 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '300ms', background: 'linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #ef4444 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              HAVE A
            </h1>
            <h1 className={`text-5xl font-black text-white leading-none mb-4 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '400ms', textShadow: '0 0 80px rgba(251, 191, 36, 0.5)' }}>
              KICK ASS
            </h1>
            <h1 className={`text-6xl font-black leading-none mb-12 transition-all duration-700 ${animate ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-8 scale-90'}`} style={{ transitionDelay: '500ms', background: 'linear-gradient(135deg, #a3e635 0%, #10b981 50%, #06b6d4 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              DAY! 💪
            </h1>

            <p className={`text-xl text-zinc-400 font-medium mb-10 transition-all duration-700 ${animate ? 'opacity-100' : 'opacity-0'}`} style={{ transitionDelay: '600ms' }}>
              You crushed it. Now go conquer the world.
            </p>

            <button onClick={onBackToStart} className={`group relative px-10 py-4 text-lg font-bold uppercase tracking-wider transition-all duration-700 ${animate ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`} style={{ transitionDelay: '700ms' }}>
              <div className="absolute inset-0 bg-zinc-900 rounded-xl border border-zinc-800 group-hover:border-zinc-700 transition-all" />
              <span className="relative text-zinc-300 group-hover:text-white transition-colors flex items-center gap-2">
                <Icon name="RotateCcw" className="w-5 h-5" />
                Start New Workout
              </span>
            </button>
          </div>

          <style>{`
            @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
            @keyframes celebrate { 0%, 100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.1) rotate(-5deg); } 75% { transform: scale(1.1) rotate(5deg); } }
          `}</style>
        </div>
      );
    };

    // ============ SET ROW ============
    const SetRow = ({ setNumber, data, onChange, onDelete, onSave, saved, canDelete }) => {
      return (
        <div className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-300 ${saved ? 'bg-emerald-900/50 ring-1 ring-emerald-400' : 'bg-zinc-900/80'}`}>
          <div className="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800 text-zinc-300 font-bold text-sm">{setNumber}</div>
          
          <div className="flex-1 grid grid-cols-2 gap-2">
            <div className="relative">
              <input type="number" inputMode="decimal" value={data.weight} onChange={(e) => onChange({ ...data, weight: e.target.value })} placeholder="0" className="w-full px-3 py-3 text-base font-bold text-center text-white bg-black border border-zinc-800 rounded-lg focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600" />
              <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-zinc-500">lbs</span>
            </div>
            <div className="relative">
              <input type="number" inputMode="numeric" value={data.reps} onChange={(e) => onChange({ ...data, reps: e.target.value })} placeholder="0" className="w-full px-3 py-3 text-base font-bold text-center text-white bg-black border border-zinc-800 rounded-lg focus:border-lime-400 focus:outline-none transition-all placeholder-zinc-600" />
              <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-zinc-500">reps</span>
            </div>
          </div>

          <button onClick={onSave} disabled={!data.weight || !data.reps} className={`w-12 h-12 rounded-lg font-bold transition-all duration-300 flex items-center justify-center ${saved ? 'bg-emerald-500 text-white' : data.weight && data.reps ? 'bg-lime-400 text-black hover:bg-lime-300 active:scale-95' : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'}`}>
            {saved ? <Icon name="Check" className="w-5 h-5" /> : <Icon name="Zap" className="w-5 h-5" />}
          </button>

          {canDelete && (
            <button onClick={onDelete} className="w-10 h-10 rounded-lg bg-zinc-900 text-zinc-500 hover:bg-red-900/50 hover:text-red-400 transition-all flex items-center justify-center">
              <Icon name="Trash2" className="w-4 h-4" />
            </button>
          )}
        </div>
      );
    };

    // ============ EXERCISE CARD ============
    const ExerciseCard = ({ exercise, currentSets, previousSets, onUpdateSet, onSaveSet, onAddSet, onDeleteSet, savedSets, onDeleteExercise }) => {
      const [expanded, setExpanded] = useState(true);
      const completedSetsCount = savedSets.filter(Boolean).length;

      return (
        <div className="relative overflow-hidden rounded-2xl bg-zinc-900" style={{ boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05)' }}>
          <div className={`absolute top-0 left-0 right-0 h-1 ${exercise.isDefault ? 'bg-gradient-to-r from-lime-400 via-emerald-400 to-cyan-400' : 'bg-gradient-to-r from-purple-400 via-pink-400 to-rose-400'}`} />
          
          <div className="flex items-start">
            <button onClick={() => setExpanded(!expanded)} className="flex-1 p-5 flex items-center justify-between text-left">
              <div className="flex-1 pr-4">
                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <span className={`px-2 py-0.5 text-[10px] font-bold uppercase tracking-widest rounded-full ${exercise.isDefault ? 'bg-lime-400/20 text-lime-400' : 'bg-purple-400/20 text-purple-400'}`}>{exercise.muscle}</span>
                  <span className="text-zinc-500 text-xs font-medium">{exercise.sets} sets × {exercise.reps} reps</span>
                  {!exercise.isDefault && <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-widest bg-zinc-800 text-zinc-400 rounded-full">Custom</span>}
                </div>
                <h3 className="text-lg font-bold text-white leading-tight tracking-tight">{exercise.name}</h3>
                <div className="flex items-center gap-1.5 mt-2">
                  {Array.from({ length: exercise.sets }).map((_, i) => (
                    <div key={i} className={`w-2 h-2 rounded-full transition-all ${savedSets[i] ? 'bg-lime-400' : 'bg-zinc-700'}`} />
                  ))}
                  <span className="text-xs text-zinc-500 ml-1">{completedSetsCount}/{exercise.sets}</span>
                </div>
              </div>
              <div className={`p-2 rounded-xl transition-all duration-300 ${expanded ? 'bg-zinc-800 rotate-180' : 'bg-zinc-800/50'}`}>
                <Icon name="ChevronDown" className="w-5 h-5 text-zinc-400" />
              </div>
            </button>
            
            {!exercise.isDefault && (
              <button onClick={() => onDeleteExercise(exercise.id)} className="mt-5 mr-3 p-2 rounded-xl bg-zinc-800 text-zinc-500 hover:bg-red-900/50 hover:text-red-400 transition-all">
                <Icon name="Trash2" className="w-4 h-4" />
              </button>
            )}
          </div>

          <div className={`transition-all duration-300 ease-out ${expanded ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0 overflow-hidden'}`}>
            <div className="px-5 pb-5">
              <div className="mb-4 p-4 rounded-xl bg-black border border-zinc-800">
                <div className="flex items-center gap-2 mb-3">
                  <Icon name="Clock" className="w-4 h-4 text-amber-400" />
                  <span className="text-xs font-semibold uppercase tracking-wider text-amber-400">Last Session</span>
                </div>
                {previousSets && previousSets.length > 0 ? (
                  <div className="space-y-2">
                    {previousSets.map((set, index) => (
                      <div key={index} className="flex items-center gap-3">
                        <span className="w-6 h-6 flex items-center justify-center rounded bg-zinc-800 text-zinc-400 text-xs font-bold">{index + 1}</span>
                        <span className="text-white font-semibold">{set.weight} lbs</span>
                        <span className="text-zinc-500">×</span>
                        <span className="text-white font-semibold">{set.reps} reps</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-zinc-500 italic text-sm">No previous data</p>
                )}
              </div>

              <div className="space-y-2 mb-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Current Session</span>
                  <div className="flex items-center gap-1 text-xs text-zinc-500">
                    <span className="font-medium">Weight</span>
                    <span className="text-zinc-600 mx-2">|</span>
                    <span className="font-medium">Reps</span>
                  </div>
                </div>
                
                {currentSets.map((set, index) => (
                  <SetRow key={index} setNumber={index + 1} data={set} onChange={(newData) => onUpdateSet(index, newData)} onDelete={() => onDeleteSet(index)} onSave={() => onSaveSet(index)} saved={savedSets[index]} canDelete={currentSets.length > 1} />
                ))}
              </div>

              <button onClick={onAddSet} className="w-full py-3 px-4 rounded-xl font-semibold text-sm border-2 border-dashed border-zinc-800 text-zinc-500 hover:border-zinc-700 hover:text-zinc-400 transition-all flex items-center justify-center gap-2">
                <Icon name="Plus" className="w-4 h-4" />
                Add Extra Set
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============ MAIN APP ============
    function WorkoutTracker() {
      const [currentPage, setCurrentPage] = useState('front');
      const [exercises, setExercises] = useState(defaultExercises);
      const [currentSession, setCurrentSession] = useState({});
      const [previousSession, setPreviousSession] = useState({});
      const [savedSets, setSavedSets] = useState({});
      const [loading, setLoading] = useState(true);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [resetSuccess, setResetSuccess] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);

      const initializeSets = (numSets) => Array.from({ length: numSets }, () => ({ weight: '', reps: '' }));

      useEffect(() => {
        const loadData = () => {
          try {
            const exercisesResult = storage.get('pushday-exercises-v3');
            if (exercisesResult?.value) setExercises(JSON.parse(exercisesResult.value));
          } catch (e) {}
          try {
            const prevResult = storage.get('pushday-previous-v3');
            if (prevResult?.value) setPreviousSession(JSON.parse(prevResult.value));
          } catch (e) {}
          try {
            const currResult = storage.get('pushday-current-v3');
            if (currResult?.value) setCurrentSession(JSON.parse(currResult.value));
          } catch (e) {}
          try {
            const savedResult = storage.get('pushday-saved-v3');
            if (savedResult?.value) setSavedSets(JSON.parse(savedResult.value));
          } catch (e) {}
          setLoading(false);
        };
        loadData();
      }, []);

      const getCurrentSets = (exerciseId, defaultSets) => currentSession[exerciseId] || initializeSets(defaultSets);
      const getSavedSets = (exerciseId, numSets) => savedSets[exerciseId] || Array(numSets).fill(false);

      const handleAddExercise = (newExercise) => {
        const updatedExercises = [...exercises, newExercise];
        setExercises(updatedExercises);
        storage.set('pushday-exercises-v3', JSON.stringify(updatedExercises));
      };

      const handleDeleteExercise = (exerciseId) => {
        const updatedExercises = exercises.filter(e => e.id !== exerciseId);
        setExercises(updatedExercises);
        const updatedCurrent = { ...currentSession }; delete updatedCurrent[exerciseId];
        const updatedPrevious = { ...previousSession }; delete updatedPrevious[exerciseId];
        const updatedSaved = { ...savedSets }; delete updatedSaved[exerciseId];
        setCurrentSession(updatedCurrent);
        setPreviousSession(updatedPrevious);
        setSavedSets(updatedSaved);
        storage.set('pushday-exercises-v3', JSON.stringify(updatedExercises));
        storage.set('pushday-current-v3', JSON.stringify(updatedCurrent));
        storage.set('pushday-previous-v3', JSON.stringify(updatedPrevious));
        storage.set('pushday-saved-v3', JSON.stringify(updatedSaved));
      };

      const handleUpdateSet = (exerciseId, setIndex, data) => {
        const exercise = exercises.find(e => e.id === exerciseId);
        const currentExerciseSets = getCurrentSets(exerciseId, exercise.sets);
        const updatedSets = [...currentExerciseSets];
        updatedSets[setIndex] = data;
        const updated = { ...currentSession, [exerciseId]: updatedSets };
        setCurrentSession(updated);
        storage.set('pushday-current-v3', JSON.stringify(updated));
      };

      const handleSaveSet = (exerciseId, setIndex) => {
        const exercise = exercises.find(e => e.id === exerciseId);
        const currentExerciseSets = getCurrentSets(exerciseId, exercise.sets);
        const setData = currentExerciseSets[setIndex];
        if (!setData.weight || !setData.reps) return;

        const currentSavedStatus = getSavedSets(exerciseId, exercise.sets);
        const updatedSavedStatus = [...currentSavedStatus];
        while (updatedSavedStatus.length <= setIndex) updatedSavedStatus.push(false);
        updatedSavedStatus[setIndex] = true;
        const updatedSavedSets = { ...savedSets, [exerciseId]: updatedSavedStatus };
        setSavedSets(updatedSavedSets);

        const savedData = currentExerciseSets.filter((_, i) => updatedSavedStatus[i]).map(s => ({ weight: Number(s.weight), reps: Number(s.reps) }));
        const updatedPrevious = { ...previousSession, [exerciseId]: savedData };
        setPreviousSession(updatedPrevious);

        storage.set('pushday-saved-v3', JSON.stringify(updatedSavedSets));
        storage.set('pushday-previous-v3', JSON.stringify(updatedPrevious));
      };

      const handleAddSet = (exerciseId) => {
        const exercise = exercises.find(e => e.id === exerciseId);
        const currentExerciseSets = getCurrentSets(exerciseId, exercise.sets);
        const updatedSets = [...currentExerciseSets, { weight: '', reps: '' }];
        const updated = { ...currentSession, [exerciseId]: updatedSets };
        setCurrentSession(updated);
        const currentSavedStatus = getSavedSets(exerciseId, exercise.sets);
        const updatedSavedStatus = [...currentSavedStatus, false];
        const updatedSavedSets = { ...savedSets, [exerciseId]: updatedSavedStatus };
        setSavedSets(updatedSavedSets);
        storage.set('pushday-current-v3', JSON.stringify(updated));
        storage.set('pushday-saved-v3', JSON.stringify(updatedSavedSets));
      };

      const handleDeleteSet = (exerciseId, setIndex) => {
        const exercise = exercises.find(e => e.id === exerciseId);
        const currentExerciseSets = getCurrentSets(exerciseId, exercise.sets);
        const updatedSets = currentExerciseSets.filter((_, i) => i !== setIndex);
        const updated = { ...currentSession, [exerciseId]: updatedSets };
        setCurrentSession(updated);
        const currentSavedStatus = getSavedSets(exerciseId, exercise.sets);
        const updatedSavedStatus = currentSavedStatus.filter((_, i) => i !== setIndex);
        const updatedSavedSets = { ...savedSets, [exerciseId]: updatedSavedStatus };
        setSavedSets(updatedSavedSets);
        const savedData = updatedSets.filter((_, i) => updatedSavedStatus[i]).map(s => ({ weight: Number(s.weight), reps: Number(s.reps) }));
        const updatedPrevious = { ...previousSession, [exerciseId]: savedData };
        setPreviousSession(updatedPrevious);
        storage.set('pushday-current-v3', JSON.stringify(updated));
        storage.set('pushday-saved-v3', JSON.stringify(updatedSavedSets));
        storage.set('pushday-previous-v3', JSON.stringify(updatedPrevious));
      };

      const handleReset = () => {
        storage.delete('pushday-previous-v3');
        storage.delete('pushday-current-v3');
        storage.delete('pushday-saved-v3');
        storage.delete('pushday-exercises-v3');
        setPreviousSession({});
        setCurrentSession({});
        setSavedSets({});
        setExercises(defaultExercises);
        setShowResetConfirm(false);
        setResetSuccess(true);
        setTimeout(() => setResetSuccess(false), 2000);
      };

      const handleComplete = () => setCurrentPage('complete');

      const handleBackToStart = () => {
        storage.delete('pushday-current-v3');
        storage.delete('pushday-saved-v3');
        setCurrentSession({});
        setSavedSets({});
        setCurrentPage('front');
      };

      const completedExercises = exercises.filter(ex => {
        const saved = getSavedSets(ex.id, ex.sets);
        return saved.slice(0, ex.sets).every(Boolean);
      }).length;

      if (loading) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center">
            <div className="flex flex-col items-center gap-4">
              <Icon name="Dumbbell" className="w-12 h-12 text-lime-400 animate-pulse" />
              <p className="text-zinc-400 font-medium">Loading workout...</p>
            </div>
          </div>
        );
      }

      if (currentPage === 'front') return <FrontPage onStart={() => setCurrentPage('workout')} />;
      if (currentPage === 'complete') return <CompletionPage onBackToStart={handleBackToStart} />;

      return (
        <div className="min-h-screen bg-black text-white pb-8">
          <AddExerciseModal isOpen={showAddModal} onClose={() => setShowAddModal(false)} onAdd={handleAddExercise} />

          <header className="relative overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-br from-lime-400/10 via-transparent to-emerald-400/5" style={{ filter: 'blur(100px)' }} />
            <div className="relative px-5 pt-6 pb-6">
              <button onClick={() => setCurrentPage('front')} className="flex items-center gap-2 text-zinc-500 hover:text-zinc-300 transition-colors mb-4">
                <Icon name="ArrowLeft" className="w-4 h-4" />
                <span className="text-sm font-medium">Back</span>
              </button>

              <div className="flex items-center gap-3 mb-2">
                <div className="p-2 bg-lime-400/20 rounded-xl">
                  <Icon name="Flame" className="w-6 h-6 text-lime-400" />
                </div>
                <span className="text-xs font-bold uppercase tracking-widest text-lime-400">Mike Thurston</span>
              </div>
              <h1 className="text-4xl font-black tracking-tight mb-3" style={{ textShadow: '0 0 80px rgba(163, 230, 53, 0.3)' }}>PUSH DAY</h1>
              
              <div className="flex items-center gap-3">
                <div className="flex-1 h-2 bg-zinc-900 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-lime-400 to-emerald-400 transition-all duration-500 rounded-full" style={{ width: `${(completedExercises / exercises.length) * 100}%` }} />
                </div>
                <div className="flex items-center gap-1.5">
                  <Icon name="Trophy" className="w-4 h-4 text-amber-400" />
                  <span className="text-sm font-bold text-zinc-300">{completedExercises}/{exercises.length}</span>
                </div>
              </div>
            </div>
          </header>

          <main className="px-4 space-y-4">
            {exercises.map((exercise, index) => (
              <div key={exercise.id} style={{ animationDelay: `${index * 0.1}s`, animation: 'slideUp 0.5s ease-out forwards', opacity: 0, transform: 'translateY(20px)' }}>
                <ExerciseCard exercise={exercise} currentSets={getCurrentSets(exercise.id, exercise.sets)} previousSets={previousSession[exercise.id]} savedSets={getSavedSets(exercise.id, exercise.sets)} onUpdateSet={(setIndex, data) => handleUpdateSet(exercise.id, setIndex, data)} onSaveSet={(setIndex) => handleSaveSet(exercise.id, setIndex)} onAddSet={() => handleAddSet(exercise.id)} onDeleteSet={(setIndex) => handleDeleteSet(exercise.id, setIndex)} onDeleteExercise={handleDeleteExercise} />
              </div>
            ))}

            <button onClick={() => setShowAddModal(true)} className="w-full py-5 px-6 rounded-2xl font-bold text-base border-2 border-dashed border-zinc-800 text-zinc-500 hover:border-purple-500/50 hover:text-purple-400 transition-all flex items-center justify-center gap-3 bg-zinc-900/30">
              <Icon name="Plus" className="w-6 h-6" />
              Add Custom Exercise
            </button>

            <div className="pt-6">
              <button onClick={handleComplete} className="group relative w-full py-5 text-xl font-black uppercase tracking-wider">
                <div className="absolute inset-0 bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 rounded-2xl blur-lg opacity-50 group-hover:opacity-80 transition-opacity" />
                <div className="absolute inset-0 bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 rounded-2xl group-hover:from-amber-300 group-hover:via-orange-400 group-hover:to-rose-400 transition-all active:scale-[0.98]" />
                <span className="relative text-white flex items-center justify-center gap-3" style={{ textShadow: '0 2px 4px rgba(0,0,0,0.3)' }}>
                  <Icon name="PartyPopper" className="w-7 h-7" />
                  I DID IT BIATCH!!!
                  <Icon name="PartyPopper" className="w-7 h-7" />
                </span>
              </button>
            </div>

            <div className="pt-2">
              {!showResetConfirm ? (
                <button onClick={() => setShowResetConfirm(true)} className="w-full py-4 px-6 rounded-xl font-bold text-sm uppercase tracking-wider bg-zinc-900 text-zinc-500 border border-zinc-800 hover:border-red-500/50 hover:text-red-400 transition-all flex items-center justify-center gap-2">
                  <Icon name="RotateCcw" className="w-4 h-4" />
                  Reset All Data
                </button>
              ) : (
                <div className="p-4 rounded-xl bg-red-950/50 border border-red-500/30 space-y-3">
                  <p className="text-center text-red-300 font-medium">Are you sure? This will delete all your progress.</p>
                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={() => setShowResetConfirm(false)} className="py-3 px-4 rounded-xl font-bold text-sm uppercase tracking-wider bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all">Cancel</button>
                    <button onClick={handleReset} className="py-3 px-4 rounded-xl font-bold text-sm uppercase tracking-wider bg-red-500 text-white hover:bg-red-400 transition-all">Yes, Reset</button>
                  </div>
                </div>
              )}
            </div>

            {resetSuccess && (
              <div className="fixed bottom-6 left-4 right-4 p-4 rounded-xl bg-emerald-500 text-black font-bold text-center animate-pulse">
                <Icon name="Check" className="w-5 h-5 inline mr-2" />
                All data cleared successfully!
              </div>
            )}
          </main>

          <style>{`
            @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WorkoutTracker />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('SW registered');
        }).catch(err => {
          console.log('SW registration failed');
        });
      });
    }
  </script>
</body>
</html>
